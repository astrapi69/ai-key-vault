name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Packaging sanity check. `npm pack` (not `publish --dry-run`) so an
      # already-published version does not fail the tarball assembly check.
      - run: npm pack --dry-run --workspace packages/passphrase-vault
      - run: npm pack --dry-run --workspace packages/core
      - run: npm pack --dry-run --workspace packages/react
